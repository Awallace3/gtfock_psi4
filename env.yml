name: gtf2
channels:
  - conda-forge
  - nodefaults
dependencies:
  # Build tools
  - python=3.12.12
  - cmake=3.31.6
  - ninja=1.12.1
  - git=2.49.0
  - pkg-config=0.29.2

  # Intel oneAPI LLVM C/C++ compiler wrappers (provides icx and icpx).
  # dpcpp_linux-64 also supplies its matching Intel compiler runtimes.
  - dpcpp_linux-64=2025.3.1=hf83752f_760
  # ERD/OED retain Fortran sources; use the conda-forge GNU Fortran wrapper.
  - gfortran_linux-64=14.3.0

  # One MPI ABI throughout GTFock, GTMatrix, and MKL's OpenMPI BLACS.
  - mpi=1.0=openmpi
  - libhwloc=2.12.1=default_hafda6a7_1003
  - openmpi=5.0.8=h2fe1745_110

  # Intel MKL BLAS/LAPACK selected through conda-forge's BLAS metapackages.
  # The pinned TBB/hwloc pair keeps this solve compatible with oneAPI 2025.3.
  - tbb=2022.3.0=h8d10470_1
  - libblas=3.11.0=6_h5875eb1_mkl
  - liblapack=3.11.0=6_h5e43f62_mkl
  - mkl-devel=2025.3.1=ha770c72_12
