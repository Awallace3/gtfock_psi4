name: GTFock CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gtfock-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Native build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Solver-only workaround for the audited OpenMPI package's virtual
      # __cuda constraint. The build and tests remain CPU-only and the package
      # validation separately rejects CUDA dependencies and linkage.
      CONDA_OVERRIDE_CUDA: "12.0"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Check out pinned sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Create validated toolchain environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: env.yml
          post-cleanup: all

      - name: Build GTFock and run existing tests
        run: ./build_deps.sh --clean
